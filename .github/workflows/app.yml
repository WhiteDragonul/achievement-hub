# Construiește aplicația Tauri (D51) pe fiecare sistem, pe runnerele GitHub:
#   - Windows (windows-latest): installer .exe (NSIS) și .msi;
#   - macOS (macos-latest, Apple Silicon): .dmg + .app;
#   - iOS (macos-latest): aplicația pentru simulator (un .ipa pentru telefon cere cont Apple Developer, vezi docs/build.md).
# La un tag v* (ex. v1.0.0) fișierele se atașează unui GitHub Release; altfel rămân ca artefacte ale rulării.
name: App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: app
      # tauri-action rulează `tauri build` (care construiește întâi web/ cu `npm run build:app`).
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Achievement Hub ${{ github.ref_name }}
          releaseDraft: false
      - uses: actions/upload-artifact@v4
        with:
          name: achievement-hub-${{ matrix.name }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: app
      - run: npx tauri ios build --target aarch64-sim
        working-directory: app
      - run: cd "app/src-tauri/gen/apple/build/arm64-sim" && zip -r -y "$GITHUB_WORKSPACE/achievement-hub-ios-simulator.zip" "Achievement Hub.app"
      - uses: actions/upload-artifact@v4
        with:
          name: achievement-hub-ios-simulator
          path: achievement-hub-ios-simulator.zip
