# Publică frontend-ul (web/) pe GitHub Pages: https://whitedragonul.github.io/achievement-hub/
# Adresa API-ului vine din variabila de repo API_URL, setată de scripts/present.mjs (tunelul de pe laptop, D48).
name: Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Pe Pages site-ul stă sub /achievement-hub/ (--base); local rămâne la rădăcină.
      - run: npm run build -- --base=/achievement-hub/
        working-directory: web
        env:
          # API-ul găzduit pe Render (D50); variabila de repo API_URL îl poate înlocui (ex. tunelul din D48).
          VITE_API_URL: ${{ vars.API_URL || 'https://achievement-hub-api.onrender.com' }}
      # Pages nu știe de rutele React: orice adresă necunoscută (ex. /auth/callback) primește 404.html,
      # care e chiar aplicația, iar React Router afișează pagina corectă.
      - run: cp web/dist/index.html web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
