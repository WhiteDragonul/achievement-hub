# Ține treze serverul gratuit (Render adoarme după 15 min fără cereri) și baza Supabase (pauză după 7 zile).
# /health face și o interogare în DB, deci o singură cerere le menține pe amândouă (D50).
name: Keep alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 20 https://achievement-hub-api.onrender.com/health
