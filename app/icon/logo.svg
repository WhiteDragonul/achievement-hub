<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Logo-ul Achievement Hub: un trofeu cu o coroană în spate, pe un apus (aceleași culori ca interfața, D49). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b0f55"/>
      <stop offset="0.5" stop-color="#b92a76"/>
      <stop offset="1" stop-color="#ff9a52"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.55" stop-color="#ffc85c"/>
      <stop offset="1" stop-color="#f08a3c"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffd9e6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="__RX__" fill="url(#sky)"/>
  <circle cx="512" cy="440" r="400" fill="url(#glow)"/>
  <!-- Coroana, în spatele trofeului -->
  <g fill="url(#gold)">
    <path d="M232 520 L232 250 L372 380 L512 190 L652 380 L792 250 L792 520 Z"/>
    <circle cx="232" cy="238" r="34"/>
    <circle cx="512" cy="172" r="38"/>
    <circle cx="792" cy="238" r="34"/>
  </g>
  <!-- Trofeul, în față -->
  <g fill="url(#cup)">
    <path d="M330 360 H694 V470 C694 572 612 650 512 650 C412 650 330 572 330 470 Z"/>
    <path d="M330 400 H262 C262 500 300 550 372 560" fill="none" stroke="url(#cup)" stroke-width="40" stroke-linecap="round"/>
    <path d="M694 400 H762 C762 500 724 550 652 560" fill="none" stroke="url(#cup)" stroke-width="40" stroke-linecap="round"/>
    <rect x="472" y="640" width="80" height="100"/>
    <rect x="382" y="732" width="260" height="56" rx="16"/>
    <rect x="342" y="784" width="340" height="70" rx="22"/>
  </g>
  <!-- Reflexul sticlei pe cupă -->
  <path d="M380 395 H440 V470 C440 530 470 580 520 600 C430 600 380 540 380 470 Z" fill="#ffffff" opacity="0.55"/>
  <!-- Steaua de pe cupă -->
  <path d="M512 430 l22 44 48 7 -35 34 8 48 -43 -23 -43 23 8 -48 -35 -34 48 -7 Z" fill="#f2683c"/>
</svg>
