server {
    listen 80;
    root /usr/share/nginx/html;

    # Cererile către API merg la serviciul "api" din Docker Compose (aceeași origine pentru browser, fără CORS).
    location /api/ {
        proxy_pass http://api:3000;
    }

    # Aplicație single-page: orice altă rută (ex. /users/3) primește index.html, iar React Router alege pagina.
    location / {
        try_files $uri /index.html;
    }
}
